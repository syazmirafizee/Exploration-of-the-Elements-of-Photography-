<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19191d"/>
      <stop offset="100%" stop-color="#282622"/>
    </linearGradient>
    <pattern id="dotTexture" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.12)"/>
      <circle cx="14" cy="14" r="1.2" fill="rgba(230,57,70,0.18)"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bgTexture)"/>
  <rect width="800" height="1000" fill="url(#dotTexture)"/>
  
  <!-- Surface Cadence Graphic -->
  <path d="M 100 480 Q 250 420 400 480 T 700 480" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <path d="M 100 520 Q 250 460 400 520 T 700 520" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>
  <path d="M 100 560 Q 250 500 400 560 T 700 560" fill="none" stroke="#e63946" stroke-width="2"/>
  <circle cx="400" cy="520" r="8" fill="#e63946"/>
  
  <!-- Swiss Framing Marks -->
  <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <path d="M 720 40 L 760 40 L 760 80" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <path d="M 40 920 L 40 960 L 80 960" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <path d="M 720 960 L 760 960 L 760 920" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  
  <!-- Typography inside image -->
  <text x="400" y="240" fill="#e63946" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">STUDY 02 / 03</text>
  <text x="400" y="290" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" text-anchor="middle">ELEMENT : TEXTURE</text>
  <text x="400" y="330" fill="rgba(255,255,255,0.6)" font-family="'Space Grotesk', monospace" font-size="16" letter-spacing="1" text-anchor="middle">TACTILITY · SURFACE · DETAIL</text>
  
  <text x="400" y="850" fill="rgba(255,255,255,0.5)" font-family="'Space Grotesk', monospace" font-size="14" text-anchor="middle">DROP YOUR PHOTO IN:</text>
  <text x="400" y="880" fill="#e63946" font-family="'Space Grotesk', monospace" font-size="15" font-weight="600" text-anchor="middle">assets/images/elements/element-2/</text>
